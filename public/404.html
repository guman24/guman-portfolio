<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites, so a direct hit on a
      // client-routed path (e.g. /admin) 404s here. This re-encodes the path
      // into a query string and bounces to index.html, where the script in
      // index.html <head> decodes it back before React Router mounts.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0; // custom domain serves from root, no repo segment to keep

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
